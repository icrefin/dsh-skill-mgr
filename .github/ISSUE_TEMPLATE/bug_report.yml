name: Bug report
description: Report a reproducible defect in dsh-skill-mgr so it can be fixed
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Fill in every field — incomplete reports are hard to
        act on. Redact secrets, tokens, private keys, internal hostnames, and personal
        data; use placeholders such as `192.0.2.10`, `<YOUR_EMAIL>`, `<YOUR_API_KEY>`.
        A screenshot of the panel can itself be sensitive, because it carries real
        skill names, home paths and session text, so redact it too.

        **Security vulnerability?** Stop and read SECURITY.md instead. Never open a
        public issue for a vulnerability.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      description: Confirm each item before submitting.
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I am running the latest release or a recent commit of main.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, version number, or commit SHA of dsh-skill-mgr where the bug occurs.
      placeholder: "v0.1.0 or 1a2b3c4"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node version, and the DeepSeek Harness build you ran it against.
      placeholder: "macOS 15.5, Node 22.19.0, pnpm 11.8.0, dsh 0.2.0-rc.2"
    validations:
      required: true

  - type: textarea
    id: catalog
    attributes:
      label: Skill name, root and state
      description: The skill's folder name, which writable root it lives in, and whether it is enabled, disabled or in the trash. A project skill discovered beside a workspace is listed read-only here, so say so if that is what you picked.
      placeholder: |
        pdf-toolkit     ~/.dsh/skills      enabled    (SKILL.md)
        pdf-toolkit     ~/.agents/skills   disabled   (SKILL.md.disabled)
        notes-tool      ~/.dsh/skills      in the trash
      render: text
    validations:
      required: true

  - type: textarea
    id: difference
    attributes:
      label: What the panel showed vs. what is on disk
      description: The row's status and the discovery-diagnostics wording, against the real contents of the root and the registry. This difference is usually the bug.
      placeholder: |
        Panel:        pdf-toolkit · disabled · last used 2d ago
        On disk:      ~/.dsh/skills/pdf-toolkit/SKILL.md.disabled
        Diagnostics:  1 skill is not discoverable — frontmatter has no `description`
        Registry:     {"disabled":{...},"trash":[],"stats":{...}}
      render: text
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact, minimal steps. Number them. Include the command or the UI path.
      placeholder: |
        1. Install the bundle into profile '...'
        2. Open the Skills page and search for '...'
        3. Choose Disable / Inspect / Delete / Add skill / a diagnostics fix
        4. Observe '...'
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened, including the full error text.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, console output, or a screenshot of the control
      description: Paste raw console output where possible; it carries the `[dsh-skill-mgr]` breadcrumbs and the full failure reason. Redact a screenshot before attaching it.
      render: text
    validations:
      required: false

  - type: dropdown
    id: regression
    attributes:
      label: Did this work before?
      options:
        - "No — first time using this plugin"
        - "Yes — it regressed in a later version"
        - Not sure
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Anything that makes the bug go away, even partly — for example re-enabling the skill from the panel, restoring it from the trash, or renaming `SKILL.md.disabled` back by hand.
    validations:
      required: false

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
